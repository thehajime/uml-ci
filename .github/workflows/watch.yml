name: Watch linux-um
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: linux-um-inbox
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: inbox-state
          path: state
      - name: Dispatch new patch series
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/tools/watch.sh
